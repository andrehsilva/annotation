# Passa adiante o X-Forwarded-Proto que chegou; se não veio, usa o esquema da conexão. Reescrever com
# `$scheme` puro apagaria o "https" do proxy e quebraria o guard de origem do BFF nas escritas.
map $http_x_forwarded_proto $anotai_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name anotai.sacadaweb.com.br;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 40m;   # acima do teto de 30 MB do bucket; subir para 260m se o Appwrite for a 256 MB

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $anotai_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /media/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $anotai_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 80;
    server_name appwrite.sacadaweb.com.br;

    client_max_body_size 0;     # uploads do console/API não passam por limite aqui

    location / {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;      # realtime do Appwrite é websocket
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $anotai_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
