# Não anuncia a versão do nginx nas respostas (nem nas páginas de erro).
server_tokens off;

# Freio por IP no login: o limite por e-mail do BFF (`Attempts`) não vê quem troca de e-mail a cada
# tentativa. 20/min com folga de 10 é invisível para quem digita errado e caro para quem varre.
limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;

# Passa adiante o X-Forwarded-Proto que chegou; se não veio, usa o esquema da conexão. Reescrever com
# `$scheme` puro apagaria o "https" do proxy e quebraria o guard de origem do BFF nas escritas.
#
# O `Host` vai verbatim (`$http_host`): o guard de `app/main.py` compara `Origin` com `scheme://host`, e
# o `$host` do nginx perde a porta — fora da 443/80 toda escrita viraria 403.
map $http_x_forwarded_proto $anotai_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name anotai.sacadaweb.com.br;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 40m;   # acima do teto de 30 MB do bucket; subir para 260m se o Appwrite for a 256 MB

    # Cabeçalhos de segurança do app. A CSP não usa `unsafe-inline` em script nem em estilo: o
    # bootstrap de tema saiu para `/theme.js` (index.html) justamente para caber nela. `frame-src`
    # fica restrito a YouTube/Vimeo, que é de onde o editor monta os `iframe` de vídeo.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self'; frame-src https://www.youtube.com https://player.vimeo.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $anotai_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # O freio extra do login fica aqui, onde o IP do cliente é conhecido.
    location = /api/auth/login {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $anotai_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /media/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $anotai_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 80;
    server_name appwrite.sacadaweb.com.br;

    # Teto em vez de "sem teto": o endpoint do console não exige autenticação para chegar até aqui, e
    # corpo sem limite era bufferizado em disco. 40 MB cobre o teto de 30 MB do bucket.
    client_max_body_size 40m;

    # O console do Appwrite tem as políticas dele: aqui só o que não interfere.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;      # realtime do Appwrite é websocket
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $anotai_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# Caminho interno do BFF até o Appwrite, sem sair do host: `api` resolve `web` (nome do compose) e o
# nome do stack do Appwrite (`traefik`, resolvido em tempo de requisição) só existe na rede do painel —
# o container `api` não está nela. Com isto cada consulta ao Appwrite deixa de dar a volta pelo
# Cloudflare: era ~0,3 s por consulta, e cada tela faz uma dúzia delas.
#
# Este bloco não é alcançável de fora: o Traefik do painel só roteia os dois domínios acima, e o nome
# `web` só resolve dentro das redes do Docker.
server {
    listen 80;
    server_name web;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;   # DNS interno do Docker
        set $appwrite_stack traefik;
        proxy_pass http://$appwrite_stack:80;
        proxy_http_version 1.1;
        proxy_set_header Host appwrite.sacadaweb.com.br;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
