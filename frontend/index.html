<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NotAI</title>
    <meta
      name="description"
      content="AnotAI: caderno de anotações para desenvolvedores. Cadernos, notas, blocos de texto/código/imagem/vídeo, tags e relações entre notas."
    />
    <meta name="application-name" content="AnotAI" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AnotAI" />
    <meta
      property="og:description"
      content="Caderno de anotações para desenvolvedores: blocos de texto, código, url, imagem e vídeo, com tags e relações entre notas."
    />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b1b1b" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f6fa" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#6ba5f8" />
    <script>
      // Applied before first paint so the theme never flashes.
      try {
        const stored = localStorage.getItem("notai-theme");
        if (stored === "light" || stored === "dark") {
          document.documentElement.dataset.theme = stored;
        }
      } catch (error) {
        void error;
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
